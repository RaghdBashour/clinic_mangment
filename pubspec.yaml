name: clinic_manager
description: "Offline clinic management for a single practice."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  material_ui: ^1.11.0
  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Local storage
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3: ^3.9.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  path_provider: ^2.1.6

  # Security
  local_auth: ^3.0.2

  # Utilities
  crypto: ^3.0.8
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
  generate: true

# Use the Linux system SQLite for fast, offline tests. Android ships the
# bundled, pinned SQLite build from package:sqlite3.
# The absolute Linux path points at the system sqlite3 runtime library, which
# is enough for unit tests on this development machine.
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        default: sqlite3
      name:
        linux: /lib/x86_64-linux-gnu/libsqlite3.so.0
        default: sqlite3
